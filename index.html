<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏭 Recipe Calculator</h1>
            <p class="subtitle">Optimize your factory production</p>
        </header>

        <main>
            <!-- Input Section -->
            <section class="input-section">
                <h2>Configuration</h2>
                
                <div class="form-group">
                    <label for="worldType">World Type:</label>
                    <select id="worldType">
                        <option value="default">Default World</option>
                        <option value="gen2">Gen2 World</option>
                        <option value="auto">Auto (Preset Max)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="extractorLevel">Extractor Level:</label>
                    <select id="extractorLevel">
                        <option value="1">Level 1</option>
                        <option value="2">Level 2</option>
                        <option value="3">Level 3</option>
                        <option value="4">Level 4</option>
                        <option value="5" selected>Level 5</option>
                    </select>
                </div>

                <div class="resource-inputs">
                    <h3>Resource Node Configuration</h3>
                    <div id="nodeCountsContainer"></div>
                </div>

                <div class="form-group">
                    <label for="nuclearPlants">Nuclear Power Plants:</label>
                    <input type="number" id="nuclearPlants" min="0" value="50">
                </div>

                <button class="calculate-btn" id="calculateBtn">Calculate Production</button>
                <button class="reset-btn" id="resetBtn">Reset to Defaults</button>
            </section>

            <!-- Results Section -->
            <section class="results-section" id="resultsSection" style="display: none;">
                <h2>Results</h2>
                
                <div class="result-tabs">
                    <button class="tab-btn active" data-tab="resources">Raw Resources</button>
                    <button class="tab-btn" data-tab="recipes">Recipes</button>
                    <button class="tab-btn" data-tab="items">Item Flow</button>
                </div>

                <div class="tab-content">
                    <div id="resources" class="tab active">
                        <div id="resourcesOutput"></div>
                    </div>
                    <div id="recipes" class="tab">
                        <div id="recipesOutput"></div>
                    </div>
                    <div id="items" class="tab">
                        <div id="itemsOutput"></div>
                    </div>
                </div>
            </section>

            <!-- Error Section -->
            <section id="errorSection" class="error-section" style="display: none;">
                <p id="errorMessage"></p>
            </section>
        </main>
    </div>

    <script src="calculator.js"></script>
    <script src="ui.js"></script>
</body>
</html>
